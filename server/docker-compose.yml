services:
  ai-service:
    build:
      context: ../ai-service
    container_name: bodycam-ai
    restart: unless-stopped
    environment:
      INSIGHTFACE_ROOT: /app/models/insightface
      INSIGHTFACE_MODEL: buffalo_l
    volumes:
      - insightface:/app/models/insightface
    expose:
      - "8001"

  bodycam:
    build: .
    container_name: bodycam-gateway
    restart: unless-stopped
    depends_on:
      - ai-service
    environment:
      BODYCAM_TOKEN: X01040688
      # Other apps: live video/audio per bodycam. Not the device ingest token.
      BODYCAM_API_TOKEN: BC-LIVE-K8m2Qp4nR7xW
      BODYCAM_API_TOKENS: '{"bodycam-01":"BC-01-n4T8vL2qH9cF","bodycam-02":"BC-02-w6Y1dM5sJ3bA","bodycam-03":"BC-03-p7C0kR8uE2gZ"}'
      # Same-provider private IP — public 45.250.101.16:4000 times out from this VPS (hairpin).
      PQTALKIE_URL: http://192.168.245.99:4000
      # Per-device kiosk slug (not the HTTPS SPA URL on :3443). Channel comes from auth.
      # ESP bodycam kiosk slug (channel comes from PQTALKIE auth — ch 11).
      PQTALKIE_TOKENS: '{"bodycam-03":"nW6M9EmsFqX2OLvyfoxaP7Yw"}'
      # Optional default if a unit has no entry in PQTALKIE_TOKENS:
      PQTALKIE_TOKEN: ""
      DATA_DIR: /data
      AI_URL: http://ai-service:8001
      # ESP32-S3-CAM dipasang horizontal → putar frame agar tegak (0/90/180/270)
      CAMERA_ROTATE: "270"
      # Copy of each finished frame. Ignored if the bridge container is down.
      LIVEKIT_INGEST: livekit-bridge:50301
      LIVEKIT_API_KEY: bodycam
      LIVEKIT_API_SECRET: b7e2c9a14f6d4803ae51c8d07f3a9b26
      LIVEKIT_PUBLIC_URL: ws://45.250.101.17:7891
    ports:
      - "7890:8080"
      - "50300:50300/udp"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  # WebRTC for browsers. Does not take UDP 50300 or TCP 7890.
  # Signaling is the spare port 7891. Media UDP stays inside 50300-50400.
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: bodycam-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7891:7880"
      - "50320-50359:50320-50359/udp"

  livekit-bridge:
    build: ./livekit-bridge
    container_name: bodycam-livekit-bridge
    restart: unless-stopped
    depends_on:
      - livekit
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: bodycam
      LIVEKIT_API_SECRET: b7e2c9a14f6d4803ae51c8d07f3a9b26
      LIVEKIT_TOKEN: X01040688
      LISTEN: :50301

volumes:
  insightface:
