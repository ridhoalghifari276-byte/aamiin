[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; No fixed COM number: the CH343 bridge re-enumerates after every reset,
; so let PlatformIO detect the port instead of pinning a stale one.
upload_speed = 921600

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_MALLOC
    -DCONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    adafruit/Adafruit NeoPixel @ ^1.15.5
    links2004/WebSockets @ ^2.7.0
