<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodycam Live</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #0e141b; color: #d7e2ea; }
    header { padding: 14px 18px; border-bottom: 1px solid #243140; letter-spacing: .12em; }
    main { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px; }
    video { width: 100%; background: #000; aspect-ratio: 4/3; object-fit: contain; }
    aside, footer { border: 1px solid #243140; padding: 12px 14px; }
    dt { color: #8aa0b2; }
    dd { margin: 0 0 8px; font-variant-numeric: tabular-nums; }
    footer { margin: 0 16px 16px; display: flex; justify-content: space-between; }
    .bad { color: #ff8d7a; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>BODYCAM LIVE</header>
  <main>
    <video id="view" autoplay playsinline controls></video>
    <aside>
      <dl>
        <dt>FPS</dt><dd id="fps">–</dd>
        <dt>Bitrate</dt><dd id="bitrate">–</dd>
        <dt>RTT</dt><dd id="rtt">–</dd>
        <dt>Jitter</dt><dd id="jitter">–</dd>
        <dt>Loss</dt><dd id="loss">–</dd>
        <dt>RSSI</dt><dd id="rssi">–</dd>
      </dl>
    </aside>
  </main>
  <footer>
    <span id="audio">AUDIO: WAITING</span>
    <span id="device">DEVICE: OFFLINE</span>
  </footer>
  <script>
    const params = new URLSearchParams(location.search);
    const device = params.get("device") || "bodycam-02";
    const view = document.getElementById("view");
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = (ev) => {
      view.srcObject = ev.streams[0];
      document.getElementById("audio").textContent = "AUDIO: CONNECTED";
    };
    async function connect() {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") resolve();
        else pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") resolve();
        });
      });
      const res = await fetch("/api/whep/" + encodeURIComponent(device), {
        method: "POST",
        headers: { "Content-Type": "application/sdp" },
        body: pc.localDescription.sdp
      });
      if (!res.ok) throw new Error("whep " + res.status);
      await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
    }
    connect().catch((e) => { document.getElementById("audio").textContent = "AUDIO: " + e.message; });
    setInterval(async () => {
      const res = await fetch("/api/stats");
      const data = await res.json();
      const s = (data.devices || {})[device];
      const set = (id, v) => { document.getElementById(id).textContent = v; };
      if (!s || !s.online) {
        set("device", "DEVICE: OFFLINE");
        return;
      }
      set("device", "DEVICE: ONLINE");
      set("fps", s.fps);
      set("bitrate", s.bitrate_kbps + " kbps");
      set("rtt", s.rtt_ms + " ms");
      set("jitter", s.jitter_ms + " ms");
      const loss = document.getElementById("loss");
      loss.textContent = s.loss_pct + "%";
      loss.className = s.loss_pct > 5 ? "bad" : "";
      set("rssi", s.rssi + " dBm");
    }, 1000);
  </script>
</body>
</html>
